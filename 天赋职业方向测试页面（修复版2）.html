<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>天赋职业方向测试 · 30 题测出你的天赋倾向</title>
<style>
  :root{
    --paper:#FAF5EC;
    --surface:#FFFFFF;
    --ink:#1D2433;
    --ink-2:#5A6274;
    --ink-3:#9AA1B1;
    --line:rgba(29,36,51,.09);
    --accent:#FF2442;
    --accent-ink:#D91430;
    --accent-soft:rgba(255,36,66,.08);
    --ease:cubic-bezier(.22,1,.36,1);
    --disp:"Manrope","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--paper);color:var(--ink);
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;padding:0 20px}
  .view{display:none;flex-direction:column;flex:1;padding:28px 0 40px;animation:fadeUp .45s var(--ease)}
  .view.on{display:flex}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- 通用 ---------- */
  .kicker{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--accent-ink);text-transform:uppercase}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;text-align:center;
    background:var(--accent);color:#fff;font-family:var(--disp);
    font-size:17px;font-weight:700;letter-spacing:.04em;
    padding:16px 20px;border-radius:999px;
    transition:transform .18s var(--ease),opacity .18s var(--ease);
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .fineprint{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.7}

  /* ---------- 口令页 ---------- */
  #view-gate{justify-content:center;text-align:center}
  #view-gate h1{font-family:var(--disp);font-size:26px;font-weight:800;margin:14px 0 10px}
  #view-gate p{color:var(--ink-2);font-size:14px;line-height:1.8;margin-bottom:26px}
  #gateInput{
    width:100%;padding:15px 18px;font-size:16px;text-align:center;letter-spacing:.15em;
    border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);
    outline:none;margin-bottom:14px;font-family:var(--disp);
  }
  #gateInput:focus{border-color:var(--accent)}
  #gateErr{color:var(--accent-ink);font-size:13px;height:18px;margin-bottom:10px}

  /* ---------- 封面 ---------- */
  #view-cover{justify-content:center}
  .cover-badge{
    align-self:flex-start;background:var(--accent-soft);color:var(--accent-ink);
    font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;margin-bottom:22px;
  }
  #view-cover h1{font-family:var(--disp);font-size:38px;font-weight:800;line-height:1.25;letter-spacing:.01em}
  #view-cover h1 em{font-style:normal;color:var(--accent-ink)}
  .cover-sub{margin:18px 0 30px;color:var(--ink-2);font-size:15px;line-height:1.9}
  .cover-meta{display:flex;gap:10px;margin-bottom:34px}
  .cover-meta div{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 0;text-align:center;
  }
  .cover-meta b{display:block;font-family:var(--disp);font-size:17px}
  .cover-meta span{font-size:11px;color:var(--ink-3)}
  #view-cover .fineprint{margin-top:16px}

  /* ---------- 答题 ---------- */
  .q-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .q-count{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
  .q-count b{color:var(--accent-ink);font-size:16px}
  .bar{flex:1;height:6px;background:rgba(29,36,51,.08);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s var(--ease)}
  .q-back{
    border:none;background:none;cursor:pointer;color:var(--ink-3);font-size:13px;padding:6px 2px;
    visibility:hidden;
  }
  .q-back.show{visibility:visible}
  .q-text{font-family:var(--disp);font-size:21px;font-weight:700;line-height:1.55;margin:16px 0 26px;min-height:66px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;width:100%;
    background:var(--surface);border:1.5px solid var(--line);border-radius:16px;
    padding:16px 16px;font-size:15.5px;line-height:1.55;color:var(--ink);
    transition:transform .15s var(--ease),border-color .15s var(--ease),background .15s var(--ease);
  }
  .opt:active{transform:scale(.985)}
  .opt .tag{
    flex:none;width:26px;height:26px;border-radius:50%;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-size:13px;font-weight:700;color:var(--ink-2);
  }
  .opt.picked{border-color:var(--accent);background:var(--accent-soft)}
  .opt.picked .tag{background:var(--accent);color:#fff}

  /* ---------- 结果 ---------- */
  .r-head{text-align:center;margin-bottom:6px}
  .r-head .kicker{display:block;margin-bottom:10px}
  .r-title{font-family:var(--disp);font-size:34px;font-weight:800;line-height:1.3}
  .r-title small{display:block;font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:6px;letter-spacing:.06em}
  .r-quote{
    margin:16px auto 4px;max-width:340px;text-align:center;
    font-size:15px;line-height:1.85;color:var(--ink-2);
  }
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin-top:18px}
  .card h3{font-family:var(--disp);font-size:14px;font-weight:800;letter-spacing:.08em;margin-bottom:14px}
  .card h3 span{color:var(--accent-ink)}
  #radar{display:block;margin:2px auto 4px;width:270px;height:240px}
  .dist{display:flex;flex-direction:column;gap:10px}
  .dist-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .dist-row .nm{width:64px;flex:none;color:var(--ink-2)}
  .dist-row .tr{flex:1;height:8px;background:rgba(29,36,51,.07);border-radius:99px;overflow:hidden}
  .dist-row .fl{display:block;height:100%;border-radius:99px;transition:width .8s var(--ease)}
  .dist-row .pc{width:38px;flex:none;text-align:right;font-family:var(--disp);font-weight:700}
  .r-desc{font-size:14.5px;line-height:1.95;color:var(--ink)}
  .r-sub{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;line-height:1.9;color:var(--ink-2)}
  .jobs{display:flex;flex-direction:column;gap:10px}
  .job{
    display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:13px 14px;
  }
  .job .no{
    flex:none;width:24px;height:24px;border-radius:8px;background:var(--accent);color:#fff;
    font-family:var(--disp);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .job b{font-size:15px}
  .job span{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
  .r-actions{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  #posterWrap{display:none;margin-top:18px;text-align:center}
  #posterWrap.on{display:block;animation:fadeUp .45s var(--ease)}
  #posterImg{width:100%;border-radius:18px;border:1px solid var(--line)}
  #posterWrap p{font-size:12px;color:var(--ink-3);margin-top:10px}
</style>
</head>
<body>
<div id="app">

  <!-- 口令 -->
  <section class="view" id="view-gate">
    <div class="kicker">Talent Test</div>
    <h1>输入口令开始测试</h1>
    <p>口令在你收到的发货文件里<br>输入一次即可，之后不用再输</p>
    <input id="gateInput" type="text" placeholder="请输入口令" autocomplete="off">
    <div id="gateErr"></div>
    <button class="btn" id="gateBtn">进入测试</button>
  </section>

  <!-- 封面 -->
  <section class="view" id="view-cover">
    <div class="cover-badge">天赋能力测评 × 职业兴趣测评</div>
    <h1>30 题测出<br>你的<em>天赋倾向</em><br>适合什么职业</h1>
    <p class="cover-sub">没有对错，按第一直觉选。<br>测出你的主天赋与副天赋，看看哪些职业方向和你天生合拍。</p>
    <div class="cover-meta">
      <div><b>30 题</b><span>情景选择题</span></div>
      <div><b>约 3 分钟</b><span>凭直觉作答</span></div>
      <div><b>6 大维度</b><span>天赋雷达图</span></div>
    </div>
    <button class="btn" id="startBtn">开始测试</button>
    <p class="fineprint">本测试为娱乐参考，不构成职业决策建议</p>
  </section>

  <!-- 答题 -->
  <section class="view" id="view-quiz">
    <div class="q-top">
      <div class="q-count"><b id="qNow">1</b> / 30</div>
      <div class="bar"><i id="qBar" style="width:3.3%"></i></div>
      <button class="q-back" id="backBtn">← 上一题</button>
    </div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="qOpts"></div>
  </section>

  <!-- 结果 -->
  <section class="view" id="view-result">
    <div class="r-head">
      <span class="kicker">Your Talent Type</span>
      <div class="r-title"><small id="rDimName"></small><span id="rTitle"></span></div>
      <p class="r-quote" id="rQuote"></p>
    </div>

    <div class="card">
      <h3>天赋雷达 <span>· 六维分布</span></h3>
      <canvas id="radar" width="540" height="480"></canvas>
      <div class="dist" id="rDist"></div>
    </div>

    <div class="card">
      <h3>天赋解读</h3>
      <p class="r-desc" id="rDesc"></p>
      <p class="r-sub" id="rSub"></p>
    </div>

    <div class="card">
      <h3>适合探索的职业方向 <span>TOP 3</span></h3>
      <div class="jobs" id="rJobs"></div>
    </div>

    <div class="r-actions">
      <button class="btn" id="posterBtn">生成结果海报</button>
      <button class="btn ghost" id="againBtn">再测一次</button>
    </div>
    <div id="posterWrap">
      <img id="posterImg" alt="天赋测试结果海报">
      <p>长按图片即可保存到相册，去分享你的天赋类型吧</p>
    </div>
    <p class="fineprint" style="margin-top:20px">本测试为娱乐参考，不构成职业决策建议</p>
  </section>

</div>

<script>
/* ============ 口令（改口令只改这一行） ============ */
const ACCESS_CODE = 'talent2026';

/* ============ 维度 ============ */
const DIMS = {
  logic:  {name:'逻辑推演', color:'#2563EB'},
  create: {name:'创意表达', color:'#EC4899'},

};
const DIM_ORDER = ['logic','create','empathy','lead','make','order'];

/* ============ 题目（d = 计分维度） ============ */

 {t:'设计感强、脑洞大的作品',d:'create'},
 {t:'商业案例和搞钱故事',d:'lead'},

/* ============ 流程 ============ */
const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0,0);
}

/* 口令 */
function gatePass(){
  localStorage.setItem('talent-test-ok','1');
  show('view-cover');
}
function checkGate(){
  const fromUrl = new URLSearchParams(location.search).get('k');
  if(fromUrl === ACCESS_CODE || localStorage.getItem('talent-test-ok')==='1'){ gatePass(); return true; }
  show('view-gate'); return false;
}
$('gateBtn').addEventListener('click',()=>{
  const v = $('gateInput').value.trim();
  if(v === ACCESS_CODE){ gatePass(); }
  else{ $('gateErr').textContent = '口令不对，看看发货文件里是不是复制漏了'; }
});
$('gateInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('gateBtn').click(); });

/* 答题 */
let cur = 0;
const answers = new Array(QUESTIONS.length).fill(-1);
$('startBtn').addEventListener('click',()=>{ cur = 0; renderQ(); show('view-quiz'); });
$('backBtn').addEventListener('click',()=>{ if(cur>0){ cur--; renderQ(); } });

function renderQ(){
  const item = QUESTIONS[cur];
  $('qNow').textContent = cur+1;
  $('qBar').style.width = ((cur+1)/QUESTIONS.length*100)+'%';
  $('backBtn').classList.toggle('show', cur>0);
  $('qText').textContent = item.q;
  const box = $('qOpts'); box.innerHTML = '';
  item.o.forEach((op,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (answers[cur]===i ? ' picked' : '');
    b.innerHTML = '<span class="tag">'+'ABCD'[i]+'</span><span>'+op.t+'</span>';
    b.addEventListener('click',()=>{
      answers[cur] = i;
      box.querySelectorAll('.opt').forEach(el=>el.classList.remove('picked'));
      b.classList.add('picked');
      setTimeout(()=>{
        if(cur < QUESTIONS.length-1){ cur++; renderQ(); }
        else{ renderResult(); }
      }, 220);
    });
    box.appendChild(b);
  });
}

/* 计分 */
function compute(){
  const score = {}, lastHit = {};
  DIM_ORDER.forEach(d=>{ score[d]=0; lastHit[d]=-1; });
  answers.forEach((ai,qi)=>{
    if(ai<0) return;
    const d = QUESTIONS[qi].o[ai].d;
    score[d]+=2; lastHit[d]=qi;
  });
  const ranked = DIM_ORDER.slice().sort((a,b)=>{
    if(score[b]!==score[a]) return score[b]-score[a];
    return lastHit[b]-lastHit[a];
  });
  return {score, main:ranked[0], sub:ranked[1]};
}

/* 雷达图（ctx 坐标系以传入的宽高为准） */
function drawRadar(ctx, cx, cy, R, score){
  const n = DIM_ORDER.length;
  const pt = (i,r)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  ctx.clearRect(0,0,cx*2,cy*2);
  /* 网格 */
  for(let ring=1; ring<=4; ring++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){ const [x,y]=pt(i% n, R*ring/4); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.strokeStyle='rgba(29,36,51,.10)'; ctx.lineWidth=1; ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const [x,y]=pt(i,R);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle='rgba(29,36,51,.10)'; ctx.stroke();
  }
  /* 数据多边形 */
  ctx.beginPath();
  DIM_ORDER.forEach((d,i)=>{
    const [x,y]=pt(i, R*Math.max(score[d],0)/40);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle='rgba(255,36,66,.16)'; ctx.fill();
  ctx.strokeStyle='#FF2442'; ctx.lineWidth=2; ctx.stroke();
  /* 顶点与标签 */
  ctx.font='700 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  DIM_ORDER.forEach((d,i)=>{
    const [x,y]=pt(i, R*Math.max(score[d],0)/40);
    ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fillStyle=DIMS[d].color; ctx.fill();
    const [lx,ly]=pt(i, R+22);
    ctx.fillStyle='#1D2433';
    ctx.fillText(DIMS[d].name, lx, ly);
  });
}

let lastResult = null;
function renderResult(){
  const r = compute(); lastResult = r;
  const R = RESULTS[r.main];
  $('rDimName').textContent = '主天赋 · ' + DIMS[r.main].name + '型';
  $('rTitle').textContent = R.title;
  $('rQuote').textContent = R.quote;
  /* 分布条 */
  const dist = $('rDist'); dist.innerHTML='';
  DIM_ORDER.slice().sort((a,b)=>r.score[b]-r.score[a]).forEach(d=>{
    const pct = Math.round(r.score[d]/40*100);
    const row = document.createElement('div');
    row.className='dist-row';
    row.innerHTML = '<span class="nm">'+DIMS[d].name+'</span>'+
      '<span class="tr"><span class="fl" style="background:'+DIMS[d].color+';width:0%"></span></span>'+
      '<span class="pc">'+pct+'%</span>';
    dist.appendChild(row);
    requestAnimationFrame(()=>{ row.querySelector('.fl').style.width = pct+'%'; });
  });
  $('rDesc').textContent = R.desc;
  $('rSub').innerHTML = '<b>副天赋 · '+DIMS[r.sub].name+'</b>：' + SUB_LINES[r.sub];
  const jobs = $('rJobs'); jobs.innerHTML='';
  R.jobs.forEach((j,i)=>{
    const el = document.createElement('div');
    el.className='job';
    el.innerHTML = '<span class="no">'+(i+1)+'</span><div><b>'+j[0]+'</b><span>'+j[1]+'</span></div>';
    jobs.appendChild(el);
  });
  $('posterWrap').classList.remove('on');
  show('view-result');
  const cv = $('radar');
  const ctx = cv.getContext('2d');
  drawRadar(ctx, 270, 240, 165, r.score);
}

/* ============ 海报 ============ */
function wrapText(ctx, text, maxW){
  const lines=[]; let line='';
  for(const ch of text){
    if(ctx.measureText(line+ch).width > maxW && line){ lines.push(line); line=ch; }
    else line+=ch;
  }
  if(line) lines.push(line);
  return lines;
}
$('posterBtn').addEventListener('click',()=>{
  if(!lastResult) return;
  const r = lastResult, R = RESULTS[r.main];
  const W=750, H=1080;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle='#FAF5EC'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFFFFF';
  ctx.beginPath(); ctx.roundRect(36,36,W-72,H-72,28); ctx.fill();
  ctx.strokeStyle='rgba(29,36,51,.08)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(36,36,W-72,H-72,28); ctx.stroke();

  ctx.textAlign='center';
  ctx.fillStyle='#D91430';
  ctx.font='700 24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('我 的 天 赋 职 业 方 向', W/2, 116);
  ctx.fillStyle='#5A6274';
  ctx.font='500 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('主天赋 · '+DIMS[r.main].name+'型', W/2, 168);
  ctx.fillStyle='#1D2433';
  ctx.font='800 64px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(R.title, W/2, 240);

  drawRadar(ctx, W/2, 500, 185, r.score);

  ctx.fillStyle='#5A6274';
  ctx.font='400 27px "PingFang SC","Microsoft YaHei",sans-serif';
  const qLines = wrapText(ctx, R.quote, W-190);
  qLines.forEach((ln,i)=> ctx.fillText(ln, W/2, 748 + i*42));

  ctx.fillStyle='#1D2433';
  ctx.font='700 29px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('适合探索：'+R.jobs.map(j=>j[0]).join(' · '), W/2, 748 + qLines.length*42 + 34);

  ctx.fillStyle='#9AA1B1';
  ctx.font='400 21px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('副天赋 · '+DIMS[r.sub].name+' ｜ 30 题测出你的天赋倾向', W/2, H-92);
  ctx.fillText('娱乐参考 · 不构成职业决策建议', W/2, H-58);

  $('posterImg').src = cv.toDataURL('image/png');
  $('posterWrap').classList.add('on');
  $('posterWrap').scrollIntoView({behavior:'smooth'});
});
